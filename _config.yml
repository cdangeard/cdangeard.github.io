about_content: | # this will include new lines to allow paragraphs
  Hi, I'm Cédric, a senior Data Engineer at Orange Business based in Nantes, France,
  and a *Databricks Certified Data Engineer Associate*.

  I'm currently building Groupe La Poste's Data Lake on Databricks, after three years as
  technical lead on the Apache NiFi stack for their large-scale SAP migrations.
  Alongside that, I teach Machine Learning and web scraping at IAE Nantes.

  I am most skilled in: <mark>Databricks</mark>, <mark>Apache Spark</mark>, <mark>Apache NiFi</mark>, <mark>Python</mark> and <mark>SQL</mark>

